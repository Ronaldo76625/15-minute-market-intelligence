name: Retrain Kalshi model

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: kalshi-live-data
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/scripts...
      - name: Train, calibrate, and evaluate model
        run: pnpm run model:refresh
      - name: Generate a live snapshot with the validated model
        run: |
          cp cloudflare/model-snapshot.json /tmp/kalshi-model.json
          pnpm run live:generate
        env:
          KALSHI_SNAPSHOT_OUTPUT: /tmp/kalshi-live-data.json
          KALSHI_MODEL_INPUT: /tmp/kalshi-model.json
      - name: Publish validated model and live snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan live-data
          cp /tmp/kalshi-live-data.json live-data.json
          cp /tmp/kalshi-model.json model-snapshot.json
          git add live-data.json model-snapshot.json
          git commit -m "Retrain Kalshi model"
          git push --force origin HEAD:live-data
