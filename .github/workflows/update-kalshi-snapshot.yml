name: Update Kalshi snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-kalshi-snapshot.yml"
      - "cloudflare/worker.ts"
      - "cloudflare/generate-live-snapshot.ts"
      - "artifacts/api-server/src/services/kalshi-model.ts"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: kalshi-live-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/scripts...
      - name: Load latest validated model
        run: |
          cp cloudflare/model-snapshot.json /tmp/kalshi-model.json
          if curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Ronaldo76625/15-minute-market-intelligence/live-data/model-snapshot.json \
            --output /tmp/published-model.json && \
            jq --exit-status '.horizons | type == "array" and length >= 9' \
              /tmp/published-model.json >/dev/null; then
            cp /tmp/published-model.json /tmp/kalshi-model.json
          fi
      - run: pnpm run live:generate
        env:
          KALSHI_SNAPSHOT_OUTPUT: /tmp/kalshi-live-data.json
          KALSHI_MODEL_INPUT: /tmp/kalshi-model.json
      - name: Publish live-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan live-data
          cp /tmp/kalshi-live-data.json live-data.json
          cp /tmp/kalshi-model.json model-snapshot.json
          git add live-data.json model-snapshot.json
          git commit -m "Update Kalshi snapshot"
          git push --force origin HEAD:live-data
      - name: Wait before the next free refresh
        if: ${{ !cancelled() }}
        run: sleep 60
      - name: Queue the next refresh
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-kalshi-snapshot.yml/dispatches \
            --data '{"ref":"main"}'
